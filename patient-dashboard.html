<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Appointments | Aadityaa Hospital</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script id="tailwind-config">
  tailwind.config = {
    theme: { extend: {
      colors: {
        "primary":"#00535b","on-primary":"#ffffff","primary-container":"#006d77","on-primary-container":"#9becf7",
        "primary-fixed":"#9ff0fb","primary-fixed-dim":"#82d3de","secondary":"#236863","secondary-container":"#a9ece5",
        "tertiary":"#911a23","on-tertiary":"#ffffff","surface":"#f5fafa","surface-container-lowest":"#ffffff",
        "surface-container":"#eaefef","surface-container-low":"#eff5f5","surface-container-high":"#e4e9e9",
        "surface-container-highest":"#dee3e3","on-surface":"#171d1d","on-surface-variant":"#3e494a",
        "outline":"#6f797a","outline-variant":"#bec8ca","background":"#f5fafa"
      },
      fontFamily: { "headline":["Manrope"], "body":["Inter"] }
    }}
  }
</script>
<style>
  .editorial-shadow { box-shadow: 0px 8px 30px rgba(23,29,29,0.07); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }
</style>
</head>
<body class="bg-background text-on-surface font-body min-h-screen">

<!-- Nav -->
<header class="w-full sticky top-0 z-50 bg-surface-container-lowest border-b border-outline-variant">
  <nav class="flex justify-between items-center max-w-5xl mx-auto px-6 h-16">
    <a href="/" class="flex items-center gap-2">
      <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white"><span class="font-black">A</span></div>
      <span class="font-bold text-primary tracking-tighter">Aadityaa Hospital</span>
    </a>
    <div class="flex items-center gap-3">
      <a href="/doctors.html" class="text-sm text-on-surface-variant hover:text-primary transition-colors hidden md:block">Book Appointment</a>
      <button id="logout-btn"
        class="text-sm font-semibold text-on-surface-variant hover:text-tertiary transition-colors flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">logout</span>
        Logout
      </button>
    </div>
  </nav>
</header>

<main class="max-w-5xl mx-auto py-10 px-6">

  <!-- Loading -->
  <div id="loading-state" class="py-20 text-center text-on-surface-variant">
    <span class="material-symbols-outlined text-5xl spin block mb-3">progress_activity</span>
    Loading your dashboard…
  </div>

  <!-- Auth error -->
  <div id="auth-error" class="hidden py-20 text-center">
    <span class="material-symbols-outlined text-5xl text-tertiary block mb-4">lock</span>
    <p class="text-on-surface-variant mb-4">Please sign in to view your appointments.</p>
    <a href="/login.html?next=/patient-dashboard.html" class="bg-primary text-white px-6 py-3 rounded-full font-bold text-sm hover:opacity-90 transition-all inline-block">Sign In</a>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden">

    <!-- User header -->
    <div class="flex flex-wrap items-center gap-4 mb-10">
      <div id="user-avatar" class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center flex-shrink-0">
        <span class="text-2xl font-black text-primary" id="user-initials">?</span>
      </div>
      <div class="flex-1 min-w-0">
        <h1 class="font-headline text-2xl font-bold truncate" id="user-name">—</h1>
        <p class="text-sm text-on-surface-variant" id="user-email">—</p>
      </div>
      <a href="/doctors.html"
         class="bg-primary text-white px-5 py-2.5 rounded-full font-bold text-sm hover:opacity-90 transition-all flex items-center gap-2 editorial-shadow">
        <span class="material-symbols-outlined text-[16px]">add</span>
        New Booking
      </a>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
      <div class="bg-surface-container-lowest rounded-2xl p-5 editorial-shadow text-center">
        <div class="text-3xl font-black font-headline text-primary" id="stat-total">—</div>
        <div class="text-xs text-on-surface-variant mt-1 font-semibold uppercase tracking-wide">Total</div>
      </div>
      <div class="bg-surface-container-lowest rounded-2xl p-5 editorial-shadow text-center">
        <div class="text-3xl font-black font-headline text-secondary" id="stat-upcoming">—</div>
        <div class="text-xs text-on-surface-variant mt-1 font-semibold uppercase tracking-wide">Upcoming</div>
      </div>
      <div class="bg-surface-container-lowest rounded-2xl p-5 editorial-shadow text-center">
        <div class="text-3xl font-black font-headline text-on-surface-variant" id="stat-completed">—</div>
        <div class="text-xs text-on-surface-variant mt-1 font-semibold uppercase tracking-wide">Completed</div>
      </div>
      <div class="bg-surface-container-lowest rounded-2xl p-5 editorial-shadow text-center">
        <div class="text-3xl font-black font-headline text-tertiary" id="stat-cancelled">—</div>
        <div class="text-xs text-on-surface-variant mt-1 font-semibold uppercase tracking-wide">Cancelled</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-2 mb-6" id="status-filters">
      <button data-filter="all"       class="filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-primary text-white">All</button>
      <button data-filter="pending"   class="filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-on-surface-variant hover:bg-secondary-container hover:text-secondary transition-all">Pending</button>
      <button data-filter="confirmed" class="filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-on-surface-variant hover:bg-secondary-container hover:text-secondary transition-all">Confirmed</button>
      <button data-filter="completed" class="filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-on-surface-variant hover:bg-secondary-container hover:text-secondary transition-all">Completed</button>
      <button data-filter="cancelled" class="filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-on-surface-variant hover:bg-secondary-container hover:text-secondary transition-all">Cancelled</button>
    </div>

    <!-- List -->
    <div id="appointments-list" class="space-y-4"></div>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="/static/js/api.js"></script>

<script>
(async () => {
  const STATUS_STYLE = {
    pending:   'bg-amber-100 text-amber-700',
    confirmed: 'bg-secondary-container text-secondary',
    completed: 'bg-surface-container-high text-on-surface-variant',
    cancelled: 'bg-error-container text-tertiary',
  };

  const loadingEl = document.getElementById('loading-state');
  const authErrEl = document.getElementById('auth-error');
  const dashEl    = document.getElementById('dashboard');
  const listEl    = document.getElementById('appointments-list');

  // ── Auth check ──────────────────────────────────────────────────────────────
  const auth = _initFirebase();
  if (!auth) { showAuthError(); return; }

  auth.onAuthStateChanged(async user => {
    if (!user) { showAuthError(); return; }

    // Populate user header
    const name     = user.displayName || user.email.split('@')[0];
    const initials = name.split(' ').filter(Boolean).map(n => n[0]).slice(0, 2).join('').toUpperCase();
    document.getElementById('user-name').textContent    = name;
    document.getElementById('user-email').textContent   = user.email;
    document.getElementById('user-initials').textContent = initials;
    if (user.photoURL) {
      document.getElementById('user-avatar').innerHTML =
        `<img src="${user.photoURL}" class="w-full h-full rounded-full object-cover">`;
    }

    // Fetch appointments
    try {
      const token = await user.getIdToken();
      const res   = await fetch('/api/appointments/mine', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const data  = await res.json();
      const apts  = data.appointments || [];

      // Stats
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('stat-total').textContent    = apts.length;
      document.getElementById('stat-upcoming').textContent = apts.filter(a =>
        (a.status === 'pending' || a.status === 'confirmed') && a.appointment_date >= today).length;
      document.getElementById('stat-completed').textContent = apts.filter(a => a.status === 'completed').length;
      document.getElementById('stat-cancelled').textContent = apts.filter(a => a.status === 'cancelled').length;

      loadingEl.classList.add('hidden');
      dashEl.classList.remove('hidden');

      // Filter logic
      let activeFilter = 'all';
      renderList(apts, activeFilter);

      document.getElementById('status-filters').querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeFilter = btn.dataset.filter;
          document.querySelectorAll('.filter-btn').forEach(b => {
            b.className = b.dataset.filter === activeFilter
              ? 'filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-primary text-white'
              : 'filter-btn px-4 py-2 rounded-full text-sm font-semibold bg-surface-container-highest text-on-surface-variant hover:bg-secondary-container hover:text-secondary transition-all';
          });
          renderList(apts, activeFilter);
        });
      });

      function renderList(all, filter) {
        const filtered = filter === 'all' ? all : all.filter(a => a.status === filter);
        if (!filtered.length) {
          listEl.innerHTML = `<div class="py-12 text-center text-on-surface-variant">
            <span class="material-symbols-outlined text-4xl block mb-3">event_busy</span>
            No ${filter === 'all' ? '' : filter} appointments found.
            ${filter === 'all' ? `<div class="mt-4"><a href="/doctors.html" class="text-primary font-semibold hover:underline">Book your first appointment</a></div>` : ''}
          </div>`;
          return;
        }
        listEl.innerHTML = filtered.map(a => appointmentCard(a)).join('');
        listEl.querySelectorAll('.cancel-btn').forEach(btn => {
          btn.addEventListener('click', () => cancelAppointment(btn.dataset.id, apts));
        });
      }

      async function cancelAppointment(id, apts) {
        if (!confirm('Cancel this appointment?')) return;
        try {
          const t   = await user.getIdToken();
          const res = await fetch(`/api/appointments/${id}/cancel`, {
            method: 'PUT', headers: { Authorization: `Bearer ${t}` }
          });
          if (!res.ok) { const j = await res.json(); throw new Error(j.error); }
          const apt = apts.find(a => a.id === id);
          if (apt) apt.status = 'cancelled';
          // Update stats
          document.getElementById('stat-cancelled').textContent =
            parseInt(document.getElementById('stat-cancelled').textContent) + 1;
          document.getElementById('stat-upcoming').textContent =
            Math.max(0, parseInt(document.getElementById('stat-upcoming').textContent) - 1);
          renderList(apts, activeFilter);
          showToast('Appointment cancelled.', 'info');
        } catch(e) { showToast(e.message, 'error'); }
      }

    } catch(_) {
      loadingEl.classList.add('hidden');
      dashEl.classList.remove('hidden');
      listEl.innerHTML = '<p class="text-center text-tertiary py-8">Failed to load appointments.</p>';
    }
  });

  function showAuthError() {
    loadingEl.classList.add('hidden');
    authErrEl.classList.remove('hidden');
  }

  document.getElementById('logout-btn').addEventListener('click', async () => {
    await Auth.logout();
  });

  function appointmentCard(a) {
    const doc        = a.doctors || {};
    const initials   = (doc.full_name || '?').split(' ').filter(Boolean).map(n => n[0]).slice(0, 2).join('');
    const specialty  = doc.specialties?.name || '';
    const dateStr    = new Date(a.appointment_date + 'T00:00:00').toLocaleDateString('en-IN',
      { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
    const badgeClass = STATUS_STYLE[a.status] || 'bg-surface-container text-on-surface-variant';
    const canCancel  = a.status === 'pending' || a.status === 'confirmed';

    return `
      <div class="bg-surface-container-lowest rounded-2xl p-5 editorial-shadow flex gap-4 items-start">
        <div class="w-12 h-12 rounded-full overflow-hidden flex-shrink-0 bg-primary/10 flex items-center justify-center">
          ${doc.photo_url
            ? `<img src="${doc.photo_url}" class="w-full h-full object-cover">`
            : `<span class="font-black text-primary/50 text-sm">${initials}</span>`}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex flex-wrap justify-between items-start gap-3 mb-2">
            <div>
              <h3 class="font-bold text-on-surface">${doc.full_name || 'Doctor'}</h3>
              <p class="text-sm text-on-surface-variant">${specialty}</p>
            </div>
            <span class="px-3 py-1 rounded-full text-xs font-bold capitalize ${badgeClass}">${a.status}</span>
          </div>
          <div class="flex flex-wrap gap-4 text-sm text-on-surface-variant mb-3">
            <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">calendar_today</span>${dateStr}</span>
            <span class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[14px]">schedule</span>${a.appointment_time}</span>
          </div>
          ${a.notes ? `<p class="text-xs text-on-surface-variant bg-surface-container rounded-lg px-3 py-2 mb-3 italic">"${a.notes}"</p>` : ''}
          ${canCancel ? `<button class="cancel-btn text-xs font-semibold text-tertiary hover:underline transition-colors" data-id="${a.id}">Cancel appointment</button>` : ''}
        </div>
      </div>`;
  }

  function showToast(msg, type = 'info') {
    const colors = { success:'bg-primary text-white', error:'bg-tertiary text-white', info:'bg-surface-container text-on-surface' };
    const el = document.createElement('div');
    el.className = `fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-sm font-semibold shadow-xl z-[9999] ${colors[type]||colors.info}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
})();
</script>
</body>
</html>
